// ---- two Tags merging (signed distance + smooth union) ----
function drawMerge(ctx,w,h,tags){
  const grid=new Array(w*h).fill(null), D=new Float32Array(w*h);

  const ins=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&D[y*w+x]<0;
  const bottom=el=>colour(el,20,37);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(!ins(x,y)) continue;
    const ds=tags.map(t=>dist(t,x,y)), oi=ds[1]<ds[0]?1:0, t=tags[oi], other=tags[1-oi];
    let lx=x-t.x, ly=y-t.y, own, oth;
    if(!ins(x-1,y)||!ins(x+1,y)||!ins(x,y-1)||!ins(x,y+1)){
      if(inArt(lx,ly)&&EDGE[ly][lx]){own=colour(t.el,lx,ly); oth=colour(other.el,lx,ly);} else {own=bottom(t.el); oth=bottom(other.el);}
    } else {
      if(!inArt(lx,ly)||EDGE[ly][lx]) [lx,ly]=inward(Math.min(N-1,Math.max(0,lx)),Math.min(N-1,Math.max(0,ly)));
      if(t.blink&&EYESET.has(lx+","+ly)&&ly<25) [lx,ly]=[lx<20?14:26,24];
      own=colour(t.el,lx,ly); oth=colour(other.el,lx,ly);
    }
    const m=Math.max(0,1-Math.abs(ds[0]-ds[1])/5);
    grid[y*w+x]=mingle(own,oth,t.el,other.el,m*m*(3-2*m));
  }
  ctx.clearRect(0,0,w,h);
  for(let i=0;i<w*h;i++) if(grid[i]){ctx.fillStyle=grid[i];ctx.fillRect(i%w,(i/w)|0,1,1);}
}

function drawBand(ctx,w,h,tags,mode="paint",time=0){
  const img=ctx.createImageData(w,h), px=img.data;
  const loc=(t,x,y)=>[(x+.5-t.cx)/(t.s*(t.sx||1))+20.5,(y+.5-t.by)/(t.s*(t.sy||1))+38];
  const dist=(t,x,y)=>{const [ax,ay]=loc(t,x,y); return sdf(Math.floor(ax),Math.floor(ay))*t.s;};
  const D=new Float32Array(w*h), O=new Int8Array(w*h), M=new Float32Array(w*h);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let u=null,best=1e9,second=1e9,bi=0;
    tags.forEach((t,i)=>{const d=dist(t,x,y); u=u===null?d:smin(u,d,3); if(d<best-(i?.8:0)){second=best;best=d;bi=i;} else if(d<second) second=d;});   // earlier Tags keep the overlap, so a newcomer does not stripe through the band
    const k=y*w+x; D[k]=u; O[k]=bi; M[k]=tags.length>1?Math.max(0,1-(second-best)/5):0;
  }
  const ins=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&D[y*w+x]<0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const k=y*w+x; if(D[k]>=0) continue;
    const t=tags[O[k]], [ax,ay]=loc(t,x,y); let lx=Math.floor(ax), ly=Math.floor(ay), src;
    const rim=!ins(x-1,y)||!ins(x+1,y)||!ins(x,y-1)||!ins(x,y+1);
    if(rim) src=inArt(lx,ly)&&EDGE[ly][lx]?[lx,ly]:[20,37];
    else {
      if(!inArt(lx,ly)||EDGE[ly][lx]) [lx,ly]=inward(Math.min(N-1,Math.max(0,lx)),Math.min(N-1,Math.max(0,ly)));
      if(t.blink&&EYESET.has(lx+","+ly)&&ly<25) [lx,ly]=[lx<20?14:26,24];
      src=[lx,ly];
    }
    const own=colour(t.el,src[0],src[1]);
    const face=!rim&&src[1]>=22&&src[1]<=28&&colour("water",src[0],src[1])==="#0550a0";
    let c=rgb(own); const b=Math.max(t.w,M[k]*.85);
    if(b>0){

      c=mix(c,bandTarget(mode,members,src,own,face,t.n,t,time,x-t.cx,y,rim),b*b*(3-2*b));
      const d=clamp((t.n-2)/3)*b; if(mode==="paint"&&rim&&d>0) c=mix(c,rgb(RIM),d*.8); }   // rim light so a dark band still reads on dark backgrounds
    px[k*4]=c[0];px[k*4+1]=c[1];px[k*4+2]=c[2];px[k*4+3]=255;
  }
  if(mode==="light") for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=y*w+x; if(D[k]<0||D[k]>3) continue;
    const t=tags[O[k]]; if(!(t.w>0)||t.n<2) continue; const a=(1-D[k]/3)*.45*clamp((t.n-1)/3);
    const c=rgb(fromLch([.9,.08,((Math.atan2(y-25,x-t.cx)*57.3+time*90)%360+360)%360]));
    px[k*4]=c[0];px[k*4+1]=c[1];px[k*4+2]=c[2];px[k*4+3]=Math.round(a*255);}
  ctx.putImageData(img,0,0);
}

const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
const back=u=>1+2.70158*(u-1)**3+1.70158*(u-1)**2;
const blink=(t,off=0)=>((t+off)%3.3)<.15?"closed":"open";
// squash before, stretch in the air, jelly landing
function hop(t,t0,height,dur){
  if(t<t0-.18||t>t0+dur+.6) return {dy:0,sx:1,sy:1};
  if(t<t0){const u=(t-t0+.18)/.18; return {dy:0,sx:1+.12*u,sy:1-.12*u};}
  if(t<t0+dur){const u=(t-t0)/dur, k=Math.abs(Math.cos(Math.PI*u)); return {dy:-Math.round(Math.sin(Math.PI*u)*height),sx:1-.06*k,sy:1+.1*k};}
  const u=(t-t0-dur), a=.14*Math.exp(-6*u)*Math.cos(16*u); return {dy:0,sx:1+a,sy:1-a};
}
const glyph=(parts,rows,x,y,c,a=1)=>rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!==".")parts.push({x:x+i,y:y+j,c,a});}));
const tone=(el,k)=>colour(el,...({light:[13,19],mid:[16,19],dark:[30,19]})[k]);
function burst(parts,el,u,x0,y0,n,speed){
  if(u<0||u>1) return;
  for(let k=0;k<n;k++){const ang=Math.PI*(.1+.8*k/(n-1)), v=speed*(.8+.4*((k*7)%3)/2);
    const x=x0+Math.cos(ang)*v*u*1.6, y=y0-Math.sin(ang)*v*u*1.6+u*u*22, c=tone(el,["mid","dark"][k%2]);
    for(const [ox,oy] of [[0,0],[1,0],[0,1],[1,1]]) parts.push({x:x+ox,y:y+oy,c,a:1-u*u});}
}
function decoParts(parts,t,name,s){
  const d=DECOS[name]; if(!d||s<=0) return;
  const w=d.px[0].length, h=d.px.length, cx=t.x+d.at[0]+w/2, cy=t.y+d.at[1]+h;
  for(let y=Math.floor(cy-h*s-1);y<=cy;y++) for(let x=Math.floor(cx-w*s/2-1);x<=cx+w*s/2+1;x++){
    const i=Math.floor((x+.5-cx)/s+w/2), j=Math.floor((y+.5-cy)/s+h);
    if(i>=0&&j>=0&&i<w&&j<h&&d.px[j][i]!==".") parts.push({x,y,c:d.c[d.px[j][i]]});
  }
}

  const small=document.createElement("canvas"); small.width=c.W; small.height=c.H; small.className="small"; small.style.width=Math.round(c.W*32/42)+"px";
  el.querySelector(".view").append(big,small); grid.append(el);
  c.ctx=big.getContext("2d"); c.sctx=small.getContext("2d"); c.lbl=el.querySelector("h4 .lbl"); c.start=0;
  if(c.click) el.onclick=()=>{c.start=clock;};
  if(c.follow){ big.onmousemove=e=>{const r=big.getBoundingClientRect(); c.mouse=[(e.clientX-r.left)/r.width*c.W,(e.clientY-r.top)/r.height*c.H];}; big.onmouseleave=()=>{c.mouse=null;}; }
}
let playing=true, clock=0, last=null;
const playBtn=document.getElementById("play");
playBtn.onclick=()=>{playing=!playing;playBtn.textContent=playing?"Pause":"Play";playBtn.className=playing?"on":"";};
function renderAll(){
  for(const c of CARDS){
    c.cycle=clock-c.start;
    const t=((c.cycle%c.period)+c.period)%c.period;
    const fr=c.f(t,c);
    if(c.band) drawBand(c.ctx,c.W,c.H,fr.tags,c.mode,clock); else if(c.merge) drawMerge(c.ctx,c.W,c.H,fr.tags); else draw(c.ctx,c.W,c.H,fr.tags,fr.parts);
    c.sctx.clearRect(0,0,c.W,c.H); c.sctx.drawImage(c.ctx.canvas,0,0);
    c.lbl.textContent=fr.label||"";
  }
}
setPalette(location.hash==="#original"?"original":"proposed");
function loop(now){
  if(last!=null&&playing) clock+=(now-last)/1000; last=now;
  renderAll(); requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script></body></html>
