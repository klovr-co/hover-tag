name: Delete hosted receiver data

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DELETE_DATA to permanently delete hosted receiver registrations.
        required: true
        type: string

permissions:
  contents: read

jobs:
  retire-data:
    name: Delete Durable Object data
    if: inputs.confirmation == 'DELETE_DATA'
    environment:
      name: tag-offline-receiver-retirement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tag-offline-receiver-retirement
      cancel-in-progress: false
    defaults:
      run:
        working-directory: services/receiver-retirement
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '1ef8d815c0091e8e40c9ba016d483dda'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check deployment credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set the repository secret CLOUDFLARE_API_TOKEN to a Cloudflare deployment token for the Tag receiver cleanup.'
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - name: Delete the Durable Object namespace and stored registrations
        run: npm run retire-data
      - name: Verify the live Worker no longer binds TagReceiver
        run: npm run verify-retirement
