name: Release package
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  package:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    outputs:
      docs_tag: ${{ steps.archive.outputs.docs_tag }}
      docs_sha: ${{ steps.archive.outputs.docs_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validate release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
          git checkout --detach "$RELEASE_TAG^{commit}"
      - name: Verify or create release archive
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TAG_POSTHOG_PROJECT_TOKEN: ${{ secrets.TAG_POSTHOG_PROJECT_TOKEN }}
          TAG_TELEMETRY_RELEASE_APPROVED: ${{ vars.TAG_TELEMETRY_RELEASE_APPROVED }}
        run: |
          python scripts/release_check.py
          source_version=$(head -n 1 VERSION)
          python scripts/release_automation.py validate-release-tag \
            --source-version "$source_version" --tag "$RELEASE_TAG"
          version=${RELEASE_TAG#v}
          case "$version" in
            *-alpha*|*-beta*) expected_prerelease=true ;;
            *) expected_prerelease=false ;;
          esac
          test "$expected_prerelease" = "${{ github.event.release.prerelease }}" || {
            echo 'Release prerelease setting does not match VERSION.' >&2
            exit 1
          }
          asset_count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')
          if [ "$asset_count" -eq 0 ]; then
            telemetry_arguments=()
            if [ "$TAG_TELEMETRY_RELEASE_APPROVED" = true ]; then
              telemetry_arguments+=(
                --posthog-host https://eu.i.posthog.com
                --posthog-project-token "$TAG_POSTHOG_PROJECT_TOKEN"
                --privacy-notice-url https://github.com/klovr-co/hover-tag/blob/main/docs/reference/telemetry.md
              )
            fi
            python scripts/package_release.py --commit-sha "$(git rev-parse HEAD)" \
              --source-ref refs/heads/main --version "$version" \
              "${telemetry_arguments[@]}"
            gh release upload "$RELEASE_TAG" \
              out/*.zip out/SHA256SUMS out/BUILD-PROVENANCE.json
          else
            mkdir -p out
            gh release download "$RELEASE_TAG" --dir out \
              --pattern "tag-$version.zip" --pattern SHA256SUMS --pattern BUILD-PROVENANCE.json
            python scripts/release_automation.py validate-release \
              --directory out --version "$version" --sha "$(git rev-parse HEAD)"
          fi
          if [ "$expected_prerelease" = false ]; then
            echo "docs_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "docs_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
  desktop:
    # Tag.app for each platform, attached to the same release. Its checksums
    # live in DESKTOP-SHA256SUMS so the CLI release contract is unchanged.
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build Tag.app
        working-directory: desktop
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # Signing and notarization happen only when these secrets are configured.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${RELEASE_TAG#v}"
          if [ "${{ matrix.name }}" = macos ]; then
            npx tauri build --target universal-apple-darwin --bundles dmg
          else
            npx tauri build
          fi
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          mkdir -p out
          bundle=desktop/src-tauri/target
          case "${{ matrix.name }}" in
            macos) cp "$bundle"/universal-apple-darwin/release/bundle/dmg/*.dmg "out/Tag-$version-macos.dmg" ;;
            windows) cp "$bundle"/release/bundle/nsis/*-setup.exe "out/Tag-$version-windows-setup.exe" ;;
            linux)
              cp "$bundle"/release/bundle/deb/*.deb "out/Tag-$version-linux-amd64.deb"
              cp "$bundle"/release/bundle/appimage/*.AppImage "out/Tag-$version-linux-x86_64.AppImage" ;;
          esac
          cd out
          if command -v sha256sum >/dev/null; then sum="sha256sum"; else sum="shasum -a 256"; fi
          $sum * > "DESKTOP-SHA256SUMS-${{ matrix.name }}"
          gh release upload "$RELEASE_TAG" * --clobber
  notify-site-docs:
    needs: package
    if: needs.package.outputs.docs_tag != ''
    uses: ./.github/workflows/notify-site-docs.yml
    with:
      tag: ${{ needs.package.outputs.docs_tag }}
      commit: ${{ needs.package.outputs.docs_sha }}
    secrets: inherit
