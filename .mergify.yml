# Mergify merge queue. Add the `queue` label (or comment `@mergifyio queue`)
# to a PR. Mergify brings it up to date with its base branch, waits for every
# required check, and merges PRs one at a time, so prerelease candidate numbers
# follow merge order. See "Merging" in CONTRIBUTING.md.

shared:
  required_checks: &required_checks
    - check-success=Policy
    - check-success=ubuntu-latest / Python 3.10
    - check-success=ubuntu-latest / Python 3.14
    - check-success=macos-latest / Python 3.12
    - check-success=windows-latest / Python 3.12
    - check-success=macos-latest / Tag.app
    - check-success=windows-latest / Tag.app
    - check-success=ubuntu-22.04 / Tag.app
    - check-success=ubuntu-latest clean install
    - check-success=macos-latest clean install
    - check-success=windows-latest clean install

  queue_conditions: &queue_conditions
    - or:
        - base=main
        - base~=^release/v[0-9]+\.[0-9]+\.x$
    - -draft
    - -conflict
    - "#changes-requested-reviews-by=0"
    # CodeRabbit approved (see .coderabbit.yaml), and every review thread,
    # CodeRabbit's or a person's, is resolved. CodeRabbit's check is neutral
    # even when it skips a review for its rate limit, so it can't be the gate.
    - "#approved-reviews-by>=1"
    - "#review-threads-unresolved=0"
    # A PR for a later version stays unmerged until the current line ships
    # stable (see "Release lines" in RELEASE.md).
    - -label~=^target:v
    # Use at most one release label; conflicting labels block publication.
    - not:
        and:
          - label=release:skip
          - label=release:next-patch
    - not:
        and:
          - label=release:skip
          - label=release:next-minor
    - not:
        and:
          - label=release:next-patch
          - label=release:next-minor

queue_rules:
  - name: default
    queue_conditions:
      - and: *queue_conditions
      - and: *required_checks
    merge_conditions:
      - and: *required_checks
    merge_method: squash
    update_method: merge

pull_request_rules:
  - name: Queue PRs labeled queue
    conditions:
      - label=queue
    actions:
      queue:
        name: default

  - name: Remove the queue label after merging
    conditions:
      - merged
      - label=queue
    actions:
      label:
        remove:
          - queue
